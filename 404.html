<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Best Career Counselling Surat | Kishan Patel | Meeta Patel | 5 Star Google Review | 1000+ Reviews</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      //
      // This site is deployed under a subpath (see DEPLOY_BASE_PATH in vite.config.ts /
      // the "predeploy" script in package.json). GitHub Pages is a static file host, so a
      // direct/refreshed visit to a client-side route like "/thank-you" 404s because no such
      // file exists on the server. This redirects that 404 back to the app's index.html with
      // the intended path encoded in the query string, which index.html then restores via
      // history.replaceState before React Router mounts.
      //
      // pathSegmentsToKeep must match the number of path segments in DEPLOY_BASE_PATH
      // (currently "/bestcareercounselling.com/" = 1 segment). Update if that ever changes.
      var pathSegmentsToKeep = 1

      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
