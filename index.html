<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#014924" />
    <!--
      Title, description, robots, canonical and OG/Twitter tags are intentionally NOT
      hardcoded here. Every page renders its own via <PageSeo> (src/components/seo/PageSeo.tsx),
      which scripts/prerender.mjs bakes into each route's own static HTML file at build
      time — so this template never has a route-specific default to fall out of sync
      with, and is never served to a real visitor without prerendering having filled
      these in first (see scripts/prerender.mjs; `npm run dev` is the only place a brief
      title-less flash before hydration is possible, which doesn't matter for local work).
    -->
    <!--
      Google Tag Manager + Microsoft Clarity (deferred together: loads after app start +
      page load). Both are pure analytics with no visible output of their own — queuing
      the real script downloads until after the page has rendered and gone idle keeps
      them from competing with the hero image and app bundle for main-thread time and
      bandwidth during the part of the load that visitors actually see and wait on.
      window.dataLayer / window.clarity are set up immediately so any call made before
      the real scripts load is queued and replayed once they're ready, same as each
      tool's own standard snippet already does.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      window.clarity = window.clarity || function () { (window.clarity.q = window.clarity.q || []).push(arguments) };

      window.__startAnalytics = function () {
        window.__startAnalytics = function () {};
        function loadGTM() {
          window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-KFNZCKML';
          document.head.appendChild(s);
        }
        function loadClarity() {
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.clarity.ms/tag/ytt2424q9z';
          document.head.appendChild(s);
        }
        function schedule() {
          function run() {
            loadGTM();
            loadClarity();
          }
          if ('requestIdleCallback' in window) requestIdleCallback(run, { timeout: 3000 });
          else setTimeout(run, 1500);
        }
        if (document.readyState === 'complete') schedule();
        else window.addEventListener('load', schedule);
      };
    </script>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KFNZCKML"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
